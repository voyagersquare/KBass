name: KBass VST3 test only - no installer
on:
  push:
    branches: [tests/kbass-system-scan]
permissions:
  contents: read
concurrency:
  group: kbass-test-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-existing-vst3:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the existing VST3 ZIP and validator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'work\test-downloads' | Out-Null
          $zip = Join-Path (Get-Location) 'work\test-downloads\KBass-Windows-VST3.zip'
          Invoke-WebRequest 'https://github.com/voyagersquare/KBass/releases/download/v0.1.0-preview.4/KBass-0.1.0-Windows-x64-VST3.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '83506eaa4a4ee28820956ebaedea92ba11457119f578ffd7a4247888003a359b') { throw 'Published VST3 checksum mismatch.' }
          Expand-Archive $zip 'work\published' -Force
          $validatorZip = Join-Path (Get-Location) 'work\test-downloads\pluginval.zip'
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $validatorZip
          if ((Get-FileHash $validatorZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') { throw 'Validator checksum mismatch.' }
          Expand-Archive $validatorZip 'work\validator' -Force
      - name: Validate the plugin from the standard system VST3 directory
        shell: powershell
        run: |
          $validator = (Get-ChildItem '.\work\validator' -Filter pluginval.exe -Recurse | Select-Object -First 1).FullName
          .\Tests\SystemPathTest.ps1 -Bundle '.\work\published\KBass.vst3' -Validator $validator -ResultsDirectory '.\work\test-results'
      - name: Upload test results and the existing portable VST3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KBass-test-only-no-installer
          path: |
            work/test-results/**
            work/test-downloads/KBass-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30
