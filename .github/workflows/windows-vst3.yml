name: KBass Windows VST3 test - Independent Audio
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: kbass-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Windows ZIP packaging before compiling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\Scripts\PortableZip.ps1
          $probe = Join-Path $env:RUNNER_TEMP 'kbass-zip-probe.zip'
          Write-PortableZip (Join-Path (Get-Location) '.github') $probe
          $zip = [IO.Compression.ZipFile]::OpenRead($probe)
          try {
            if (!$zip.GetEntry('workflows/windows-vst3.yml')) { throw 'ZIP paths are not portable.' }
          } finally { $zip.Dispose() }
      - name: Build VST3 and execute audio, state and editor tests
        shell: powershell
        run: |
          & .\Build-Windows.cmd --no-pause
          if ($LASTEXITCODE -ne 0) { throw 'Build or validation failed.' }
      - name: Capture the real native editor
        shell: powershell
        run: |
          & .\build\windows-x64\KBassProcessorTests.exe KBass-editor.png
          if ($LASTEXITCODE -ne 0) { throw 'Editor capture failed.' }
      - name: Validate the Windows VST3 with pluginval level 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'pluginval-1.0.4.zip'
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') { throw 'pluginval checksum mismatch.' }
          $folder = Join-Path $env:RUNNER_TEMP 'pluginval-1.0.4'
          Expand-Archive $archive $folder -Force
          $validator = (Get-ChildItem $folder -Filter pluginval.exe -Recurse | Select-Object -First 1).FullName
          $module = (Resolve-Path '.\build\windows-x64\KBass_artefacts\Release\VST3\KBass.vst3').Path
          $logDir = Join-Path (Get-Location) 'build\pluginval'
          $arguments = @('--strictness-level','5','--timeout-ms','60000','--output-dir',('"' + $logDir + '"'),'--validate',('"' + $module + '"'))
          $process = Start-Process -FilePath $validator -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Windows VST3 validation failed: $($process.ExitCode)" }
          $logs = Get-ChildItem $logDir -Filter '*.txt'
          if (!$logs -or !(Select-String -Path $logs.FullName -Pattern '^SUCCESS$' -Quiet)) { throw 'Missing successful pluginval report.' }
      - name: Check manufacturer and retain existing VST3 class IDs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.\build\windows-x64\KBass_artefacts\Release\VST3\KBass.vst3\Contents\Resources\moduleinfo.json'
          $raw = Get-Content $path -Raw
          $metadata = [regex]::Replace($raw, ',\s*([}\]])', '$1') | ConvertFrom-Json
          if ($metadata.Name -ne 'KBass' -or $metadata.Version -ne '0.2.0') { throw 'Unexpected plugin name or version.' }
          if ($metadata.'Factory Info'.Vendor -ne 'Independent Audio') { throw 'Wrong factory manufacturer.' }
          foreach ($class in $metadata.Classes) {
            if ($class.Vendor -ne 'Independent Audio') { throw 'Wrong class manufacturer.' }
          }
          $expected = @('ABCDEF019182FAEB567953714B427373','ABCDEF011234ABCD567953714B427373','ABCDEF01C0DEF00D567953714B427373')
          if (Compare-Object @($expected | Sort-Object) @($metadata.Classes.CID | Sort-Object)) { throw 'Existing VST3 class IDs have changed.' }
          New-Item -ItemType Directory -Force 'build\packages' | Out-Null
          @{ manufacturer='Independent Audio'; classIDsPreserved=$true; installerBuilt=$false; installerExecuted=$false; version='0.2.0' } | ConvertTo-Json | Set-Content 'build\packages\manufacturer-test-results.json' -Encoding UTF8
      - name: Package the test VST3 and matching source without an installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\Package-Windows.ps1 -SkipInstaller
          Copy-Item '.\KBass-editor.png' '.\build\packages\KBass-editor.png'
          Copy-Item '.\build\pluginval\*.txt' '.\build\packages' -Force
          if (Get-ChildItem '.\build\packages' -Filter '*.exe') { throw 'A test release must not contain an installer.' }
          $lines = Get-ChildItem '.\build\packages' -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }
          $lines | Set-Content '.\build\packages\SHA256SUMS.txt' -Encoding ASCII
      - name: Upload tested Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: KBass-Windows-x64-Test
          path: build/packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KBass-diagnostics
          path: |
            build/windows-x64/Testing/Temporary/LastTest.log
            build/pluginval/*
            KBass-editor.png
          if-no-files-found: ignore
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KBass-Windows-x64-Test
          path: packages
      - name: Validate packages and publish preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, struct, zipfile
          root=Path('packages')
          info=json.loads((root/'release-info.json').read_text(encoding='utf-8-sig'))
          assert info['sourceCommit']==os.environ['GITHUB_SHA']
          assert info['format']=='VST3' and info['standalone'] is False
          assert info['version']=='0.2.0' and info['manufacturer']=='Independent Audio'
          assert info['installerBuilt'] is False
          assert not list(root.glob('*.exe'))
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split('  ',1)
              assert Path(name).name==name
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          with zipfile.ZipFile(root/'KBass-0.2.0-Windows-x64-VST3.zip') as z:
              data=z.read('KBass.vst3/Contents/x86_64-win/KBass.vst3')
              assert data[:2]==b'MZ'
              pe=struct.unpack_from('<I',data,0x3c)[0]
              assert data[pe:pe+4]==b'PE\0\0' and struct.unpack_from('<H',data,pe+4)[0]==0x8664
          checks=json.loads((root/'manufacturer-test-results.json').read_text(encoding='utf-8-sig'))
          assert checks['manufacturer']=='Independent Audio' and checks['classIDsPreserved'] is True
          assert checks['installerBuilt'] is False and checks['installerExecuted'] is False
          PY
          cat > notes.md <<'EOF'
          KBass 0.2.0 - Independent Audio - Windows x64 VST3 test.

          Odvojeni FACTORY PRESETS i USER PRESETS izbornici u donjoj traci, SAVE za trajno spremanje vlastitih zvukova, uklonjena KB pločica i sitni natpis. Sučelje ima umjerenu patinu i fine ogrebotine. Cutoff ima preciznije pomicanje, deset puta finiji Shift način i dvostupanjsko zaglađivanje; zaglađeni su i ostali kontinuirani parametri. Proizvođač Independent Audio i postojeći VST3 identifikatori zadržani su.

          Preuzmi KBass-0.2.0-Windows-x64-VST3.zip. Zatvori DAW i zamijeni cijelu mapu KBass.vst3 u C:\Program Files\Common Files\VST3. Pokreni Ableton, napravi Rescan i potraži Independent Audio > KBass. Ako je ostao stari naziv proizvođača, drži Alt i klikni Rescan.

          Ovo je testni VST3 ZIP bez novog instalera. Windows build, DSP/MIDI/state/UI testovi, trajno spremanje i ponovno učitavanje korisničkih preseta, Save dijalog, Cutoff interakcije, pluginval level 5, proizvođač i očuvani VST3 identifikatori provjereni su u CI-u. Izvorni kod, licence i SHA-256 priloženi su uz testni paket. KBass/JUCE distribucija: AGPLv3.
          EOF
          tag="v0.2.0-test.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title 'KBass 0.2.0 - Independent Audio - VST3 test' --notes-file notes.md packages/*
